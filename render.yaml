services:
  - type: web
    name: wallet-find
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd backend && npm audit fix --package-lock-only --ignore-scripts || true && npm audit --audit-level=high && npm ci --include=dev && npx prisma generate && npm run build && cd ../frontend && npm audit fix --package-lock-only --ignore-scripts || true && npm audit --audit-level=high && npm ci --include=dev && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-find-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CONTEST_SCHEDULER_INTERVAL_MS
        value: "30000"
      - key: POLYGON_DEPOSIT_SCANNER_ENABLED
        value: "false"
      - key: POLYGON_DEPOSITS_ENABLED
        value: "false"
      - key: WALLET_GENERIC_DEPOSIT_SCANNER_ENABLED
        value: "true"
      - key: WALLET_GENERIC_DEPOSITS_PRODUCTION_READY
        value: "false"
      - key: WALLET_GENERIC_WITHDRAWALS_ENABLED
        value: "false"
      - key: WALLET_GENERIC_WITHDRAWALS_PRODUCTION_READY
        value: "false"

databases:
  - name: wallet-find-db
    plan: free
    region: frankfurt
    databaseName: wallet_find
    user: wallet_find
