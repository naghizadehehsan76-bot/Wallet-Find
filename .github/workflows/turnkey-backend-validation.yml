name: Turnkey backend validation

on:
  push:
    branches:
      - feature/real-wallet-foundation
    paths:
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/prisma/**"
      - "backend/src/modules/wallet/**"
      - ".github/workflows/turnkey-backend-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/prisma/**"
      - "backend/src/modules/wallet/**"
      - ".github/workflows/turnkey-backend-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci --include=dev
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://wallet_find:placeholder@localhost:5432/wallet_find
        run: npx prisma generate
      - name: Build backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://wallet_find:placeholder@localhost:5432/wallet_find
        run: npm run build
