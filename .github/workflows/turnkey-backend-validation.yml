name: Turnkey backend validation

on:
  push:
    branches:
      - feature/real-wallet-foundation
    paths:
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/prisma/**"
      - "backend/src/modules/wallet/**"
      - ".github/workflows/turnkey-backend-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/prisma/**"
      - "backend/src/modules/wallet/**"
      - ".github/workflows/turnkey-backend-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched transitive Effect dependency
        working-directory: backend
        run: |
          node -e 'const lock = require("./package-lock.json"); const effect = lock.packages["node_modules/effect"]; console.log(JSON.stringify(effect)); if (effect?.version !== "3.22.1") process.exit(1)'
      - name: Upload regenerated backend lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: wallet-find-backend-lockfile
          path: backend/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci --include=dev
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://wallet_find:placeholder@localhost:5432/wallet_find
        run: npx prisma generate
      - name: Build backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://wallet_find:placeholder@localhost:5432/wallet_find
        run: npm run build
