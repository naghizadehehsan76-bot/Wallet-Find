name: Temporary frontend audit report
on:
  push:
    branches:
      - feature/turnkey-wallet-ui-and-deposit-events
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate and commit lockfile
        run: |
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: update frontend lockfile for patched minimatch" || true
          git push
      - name: Install, audit and validate
        run: |
          npm ci
          npm audit --audit-level=moderate --json > audit-after.json
          npm run build
          npm run lint
      - name: Package audit report and updated lockfile
        if: always()
        run: tar -czf frontend-audit-results.tar.gz package-lock.json audit-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-audit-results
          path: frontend/frontend-audit-results.tar.gz
          if-no-files-found: warn
